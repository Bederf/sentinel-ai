# Promtail Configuration for SENTINEL BMS Intelligence
# Collects Docker container logs, system auth logs, syslog, and SENTINEL audit logs
# Ships all logs to Grafana Loki for centralised aggregation

server:
  log_level: info
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ============================================================
  # 1. Docker Container Logs (all SENTINEL containers)
  # ============================================================
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: sentinel-docker
          environment: production
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}
      - labeldrop:
          - filename
      # Parse JSON structured logs from SENTINEL backend
      - match:
          selector: '{job="sentinel-docker"}'
          stages:
            - regex:
                expression: '"container_name":"/?(?P<container_name>[^"]+)"'
            - labels:
                container_name:
            # Extract log level from Python logging output
            - regex:
                expression: '(?P<level>INFO|WARNING|ERROR|CRITICAL|DEBUG)'
            - labels:
                level:

  # ============================================================
  # 2. System Authentication Logs (SSH, sudo events)
  # ============================================================
  - job_name: system-auth
    static_configs:
      - targets:
          - localhost
        labels:
          job: sentinel-system
          component: auth
          __path__: /var/log/auth.log
    pipeline_stages:
      - regex:
          expression: '(?P<timestamp>\w+\s+\d+\s+\d+:\d+:\d+)\s+(?P<hostname>\S+)\s+(?P<service>\S+?)(\[(?P<pid>\d+)\])?:\s+(?P<message>.*)'
      - labels:
          service:
      # Tag SSH events
      - match:
          selector: '{component="auth"}'
          stages:
            - regex:
                expression: '(?P<ssh_event>Failed password|Accepted password|Invalid user|session opened|session closed)'
            - labels:
                ssh_event:

  # ============================================================
  # 3. Syslog (general system events)
  # ============================================================
  - job_name: system-syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: sentinel-system
          component: syslog
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '(?P<timestamp>\w+\s+\d+\s+\d+:\d+:\d+)\s+(?P<hostname>\S+)\s+(?P<service>\S+?)(\[(?P<pid>\d+)\])?:\s+(?P<message>.*)'
      - labels:
          service:

  # ============================================================
  # 4. SENTINEL Backend Security Events (structured JSON logs)
  # ============================================================
  - job_name: sentinel-security
    static_configs:
      - targets:
          - localhost
        labels:
          job: sentinel-security
          component: backend
          __path__: /var/log/sentinel/security.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            event_type: event_type
            severity: severity
            source_ip: source_ip
            path: path
            method: method
            status_code: status_code
      - labels:
          event_type:
          severity:
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05.000Z"

  # ============================================================
  # 5. SENTINEL Audit Log (JSON file-based audit trail)
  # ============================================================
  - job_name: sentinel-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: sentinel-audit
          component: audit
          __path__: /opt/bms-intelligence/backend/app/data/audit_log.json
    pipeline_stages:
      - multiline:
          firstline: '^\{'
          max_wait_time: 3s
      - json:
          expressions:
            action: action
            user: user
            result: result
      - labels:
          action:
          user:
          result:
