# Grafana Contact Points — Phase 189 G8
# Defines where alert notifications are sent based on severity

apiVersion: 1

contactPoints:
  - name: sentinel-ops-slack
    type: slack
    settings:
      url: "${SLACK_WEBHOOK_URL}"
      recipient: "#sentinel-alerts"
      title: "{{ if eq .Status \"firing\" }}🚨{{ else }}✅{{ end }} SENTINEL Alert: {{ .GroupLabels.alertname }}"
      text: |
        {{ range .Alerts }}
        *{{ .Labels.alertname }}*
        Severity: {{ .Labels.severity }}
        {{ .Annotations.summary }}
        {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
        {{ end }}

  - name: sentinel-ops-pagerduty
    type: pagerduty
    settings:
      integrationKey: "${PAGERDUTY_INTEGRATION_KEY}"
      severity: "{{ if eq .Labels.severity \"critical\" }}critical{{ else if eq .Labels.severity \"warning\" }}error{{ else }}warning{{ end }}"
      class: "{{ .GroupLabels.alertname }}"
      summary: "SENTINEL Alert: {{ .Labels.alertname }}"

  - name: sentinel-ops-email
    type: email
    settings:
      addresses: "${ALERT_EMAIL_RECIPIENTS}"
      subject: "[{{ .Status | toUpper }}] SENTINEL Alert: {{ .GroupLabels.alertname }}"
