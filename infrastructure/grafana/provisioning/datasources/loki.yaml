# Grafana Datasource Provisioning for SENTINEL BMS Intelligence
# Auto-provisions Loki as a log datasource in Grafana

apiVersion: 1

datasources:
  # Loki - Centralised Log Aggregation
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: Loki
          matcherRegex: "correlation_id=([\\w-]+)"
          name: correlation_id
          url: "/explore?left=[\"now-1h\",\"now\",\"Loki\",{\"expr\":\"{correlation_id=\\\"${__value.raw}\\\"}\"}}]"
