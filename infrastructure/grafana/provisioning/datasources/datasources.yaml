# Grafana Datasource Provisioning for SENTINEL BMS Intelligence
# Auto-provisions Prometheus and Loki datasources

apiVersion: 1

datasources:
  # Prometheus - Metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: "2.51.0"
      cacheLevel: 'High'
      incrementalQuerying: true

  # Loki - Centralised Log Aggregation
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: Loki
          matcherRegex: "correlation_id=([\\w-]+)"
          name: correlation_id
          url: "/explore?left=[\"now-1h\",\"now\",\"Loki\",{\"expr\":\"{correlation_id=\\\"${__value.raw}\\\"}\"}]"

  # Supabase PostgreSQL — direct query access for forensic dashboards
  - name: Supabase
    type: postgres
    access: proxy
    url: supabase_db_bms-intelligence:5432
    user: supabase_admin
    secureJsonData:
      password: postgres
    database: postgres
    isDefault: false
    editable: false
    jsonData:
      sslmode: disable
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 3600
