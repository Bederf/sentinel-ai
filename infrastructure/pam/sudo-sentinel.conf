# SENTINEL BMS Intelligence Platform - Sudoers Configuration
# File: /etc/sudoers.d/sentinel
# Purpose: Role-based privileged access controls for SENTINEL operations
# FSR Domain: 4.7 - Logical Access Control
#
# IMPORTANT: Validate with 'visudo -cf /etc/sudoers.d/sentinel' before deploying
# Install: cp sudo-sentinel.conf /etc/sudoers.d/sentinel && chmod 440 /etc/sudoers.d/sentinel
#
# Last updated: 2026-02-04
# Review cadence: Monthly

# =============================================================================
# Defaults - Global sudo policy
# =============================================================================

# Require password re-entry (no NOPASSWD)
Defaults    timestamp_timeout=15
Defaults    passwd_tries=3
Defaults    passwd_timeout=5

# Logging - all sudo commands logged
Defaults    logfile=/var/log/sudo.log
Defaults    log_input
Defaults    log_output
Defaults    iolog_dir=/var/log/sudo-io

# Security hardening
Defaults    requiretty
Defaults    use_pty
Defaults    env_reset
Defaults    secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

# Prevent shell escapes
Defaults    noexec

# =============================================================================
# Group Definitions
# =============================================================================

# sentinel-admin: Full system administrators (Shadow IT / DevOps)
# sentinel-operator: Restricted operations (service restart, log viewing)
# sentinel-developer: Development access (full docker, DB read-write)

# =============================================================================
# Admin Group - Full sudo access
# =============================================================================

# Full sudo access with password required
%sentinel-admin ALL=(ALL:ALL) ALL

# Override noexec for admin group (needs shell access for maintenance)
Defaults:%sentinel-admin !noexec

# =============================================================================
# Operator Group - Restricted operations
# =============================================================================

# Allowed commands for operators
Cmnd_Alias SENTINEL_OPS_DOCKER = \
    /usr/bin/docker ps, \
    /usr/bin/docker ps *, \
    /usr/bin/docker logs, \
    /usr/bin/docker logs *, \
    /usr/bin/docker restart, \
    /usr/bin/docker restart *, \
    /usr/bin/docker stats, \
    /usr/bin/docker stats *, \
    /usr/bin/docker inspect, \
    /usr/bin/docker inspect *, \
    /usr/bin/docker compose ps, \
    /usr/bin/docker compose logs *

Cmnd_Alias SENTINEL_OPS_SERVICE = \
    /usr/bin/systemctl status sentinel-*, \
    /usr/bin/systemctl restart sentinel-*, \
    /usr/bin/systemctl start sentinel-*, \
    /usr/bin/systemctl stop sentinel-*, \
    /usr/bin/systemctl status docker, \
    /usr/bin/systemctl restart docker

Cmnd_Alias SENTINEL_OPS_MONITOR = \
    /usr/bin/journalctl -u sentinel-*, \
    /usr/bin/journalctl -u docker*, \
    /usr/bin/tail -f /var/log/sentinel/*, \
    /usr/bin/tail -f /var/log/sudo.log, \
    /usr/bin/cat /var/log/sentinel/*, \
    /usr/bin/df, \
    /usr/bin/free, \
    /usr/bin/top, \
    /usr/bin/htop

# Denied commands for operators (explicitly blocked)
Cmnd_Alias SENTINEL_OPS_DENIED = \
    /usr/bin/docker exec, \
    /usr/bin/docker exec *, \
    /usr/bin/docker rm, \
    /usr/bin/docker rm *, \
    /usr/bin/docker rmi, \
    /usr/bin/docker rmi *, \
    /usr/bin/docker run, \
    /usr/bin/docker run *, \
    /usr/bin/docker build, \
    /usr/bin/docker build *, \
    /usr/sbin/usermod, \
    /usr/sbin/usermod *, \
    /usr/bin/passwd, \
    /usr/bin/passwd *, \
    /usr/sbin/useradd, \
    /usr/sbin/useradd *, \
    /usr/sbin/userdel, \
    /usr/sbin/userdel *, \
    /usr/sbin/visudo, \
    /usr/sbin/visudo *

# Grant allowed commands, deny dangerous ones
%sentinel-operator ALL=(ALL:ALL) SENTINEL_OPS_DOCKER, SENTINEL_OPS_SERVICE, SENTINEL_OPS_MONITOR
%sentinel-operator ALL=(ALL:ALL) !SENTINEL_OPS_DENIED

# =============================================================================
# Developer Group - Development access
# =============================================================================

# Developers get docker access and service management
Cmnd_Alias SENTINEL_DEV_DOCKER = \
    /usr/bin/docker, \
    /usr/bin/docker *

Cmnd_Alias SENTINEL_DEV_DENIED = \
    /usr/sbin/usermod, \
    /usr/sbin/usermod *, \
    /usr/bin/passwd, \
    /usr/bin/passwd *, \
    /usr/sbin/useradd, \
    /usr/sbin/useradd *, \
    /usr/sbin/userdel, \
    /usr/sbin/userdel *, \
    /usr/sbin/visudo, \
    /usr/sbin/visudo *, \
    /usr/sbin/iptables, \
    /usr/sbin/iptables *, \
    /usr/sbin/ufw, \
    /usr/sbin/ufw *

%sentinel-developer ALL=(ALL:ALL) SENTINEL_DEV_DOCKER, SENTINEL_OPS_SERVICE, SENTINEL_OPS_MONITOR
%sentinel-developer ALL=(ALL:ALL) !SENTINEL_DEV_DENIED

# Override noexec for developer group (needs shell for debugging)
Defaults:%sentinel-developer !noexec

# =============================================================================
# Auditor Group - Read-only access
# =============================================================================

Cmnd_Alias SENTINEL_AUDIT = \
    /usr/bin/cat /var/log/sentinel/*, \
    /usr/bin/cat /var/log/sudo.log, \
    /usr/bin/cat /var/log/auth.log, \
    /usr/bin/tail /var/log/sentinel/*, \
    /usr/bin/tail -f /var/log/sentinel/*, \
    /usr/bin/docker logs, \
    /usr/bin/docker logs *, \
    /usr/bin/docker ps, \
    /usr/bin/last, \
    /usr/bin/lastlog, \
    /usr/bin/who, \
    /usr/bin/w

%sentinel-auditor ALL=(ALL:ALL) SENTINEL_AUDIT
