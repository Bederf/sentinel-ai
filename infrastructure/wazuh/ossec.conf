<!--
  SENTINEL BMS Intelligence - Wazuh Agent Configuration
  Host-Based Intrusion Detection for Contabo VPS (Ubuntu 24.04)

  FSR Domain 4.13: Incident Detection (HIGH gap)
  Covers both SENTINEL and AimTheLaw on shared infrastructure.

  Capabilities:
  - File Integrity Monitoring (FIM) - detect credential/config changes
  - Log Analysis - SSH brute force, sudo abuse, system events
  - Rootkit Detection - kernel-level compromise detection
  - Active Response - automated IP blocking on attack detection
-->

<ossec_config>

  <!-- ============================================================ -->
  <!-- Agent Configuration                                          -->
  <!-- ============================================================ -->
  <client>
    <!-- Standalone mode: local log analysis without central manager -->
    <!-- Change to Wazuh manager IP/hostname if central manager deployed -->
    <server>
      <address>localhost</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>ubuntu, ubuntu24</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- ============================================================ -->
  <!-- File Integrity Monitoring (FIM)                              -->
  <!-- Detects unauthorized changes to critical system/app files    -->
  <!-- ============================================================ -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>600</frequency> <!-- Check every 10 minutes -->
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- System credential files -->
    <directories check_all="yes" realtime="yes">/etc/passwd</directories>
    <directories check_all="yes" realtime="yes">/etc/shadow</directories>
    <directories check_all="yes" realtime="yes">/etc/group</directories>
    <directories check_all="yes" realtime="yes">/etc/sudoers</directories>

    <!-- SSH configuration -->
    <directories check_all="yes" realtime="yes">/etc/ssh/sshd_config</directories>
    <directories check_all="yes">/etc/ssh/ssh_config</directories>
    <directories check_all="yes" realtime="yes">/root/.ssh</directories>

    <!-- Docker configuration -->
    <directories check_all="yes" realtime="yes">/etc/docker/daemon.json</directories>

    <!-- SENTINEL application files (detect credential/config changes) -->
    <directories check_all="yes" realtime="yes">/opt/bms-intelligence/backend/.env</directories>
    <directories check_all="yes">/opt/bms-intelligence/docker-compose.yml</directories>
    <directories check_all="yes">/opt/bms-intelligence/backend/app/config</directories>

    <!-- AimTheLaw application files (shared infrastructure) -->
    <directories check_all="yes" realtime="yes">/opt/aimthelaw/.env</directories>
    <directories check_all="yes">/opt/aimthelaw/docker-compose.yml</directories>

    <!-- Crontab files -->
    <directories check_all="yes" realtime="yes">/etc/crontab</directories>
    <directories check_all="yes" realtime="yes">/var/spool/cron</directories>

    <!-- System binaries (detect trojan replacement) -->
    <directories check_all="yes">/usr/bin</directories>
    <directories check_all="yes">/usr/sbin</directories>
    <directories check_all="yes">/sbin</directories>

    <!-- Ignore noisy directories -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/resolv.conf</ignore>
    <ignore type="sregex">.log$|.swp$</ignore>

    <!-- Report changes in file content -->
    <nodiff>/etc/ssl/private.key</nodiff>

    <!-- Windows-style exclusions not needed on Linux -->
  </syscheck>

  <!-- ============================================================ -->
  <!-- Log Analysis                                                 -->
  <!-- Monitor system and application logs for security events      -->
  <!-- ============================================================ -->

  <!-- System authentication logs (SSH brute force, sudo abuse) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- System log (general events) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- Kernel messages -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/kern.log</location>
  </localfile>

  <!-- Docker daemon logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/daemon.log</location>
  </localfile>

  <!-- Fail2Ban logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/fail2ban.log</location>
  </localfile>

  <!-- SENTINEL security events (JSON structured) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/sentinel/security.log</location>
    <label key="app">sentinel</label>
  </localfile>

  <!-- ============================================================ -->
  <!-- Rootkit Detection                                            -->
  <!-- Detect kernel-level rootkits and hidden processes            -->
  <!-- ============================================================ -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>

    <!-- Run every 12 hours -->
    <frequency>43200</frequency>

    <rootkit_files>/var/ossec/etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>/var/ossec/etc/shared/rootkit_trojans.txt</rootkit_trojans>
  </rootcheck>

  <!-- ============================================================ -->
  <!-- Active Response                                              -->
  <!-- Automated blocking of detected attack sources                -->
  <!-- ============================================================ -->
  <active-response>
    <disabled>no</disabled>

    <!-- Block IP after 5 failed SSH attempts -->
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5712</rules_id>
    <timeout>3600</timeout> <!-- 1 hour block -->
    <repeated_offenders>60,120,720,1440</repeated_offenders>
  </active-response>

  <!-- ============================================================ -->
  <!-- Alert Configuration                                          -->
  <!-- ============================================================ -->
  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- ============================================================ -->
  <!-- Logging Output                                               -->
  <!-- JSON format for Loki/Promtail ingestion                     -->
  <!-- ============================================================ -->
  <logging>
    <log_format>json</log_format>
  </logging>

</ossec_config>
