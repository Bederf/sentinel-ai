# SENTINEL BMS Intelligence Platform - SSH Hardening Configuration
# File: /etc/ssh/sshd_config.d/sentinel-hardening.conf
# Purpose: Hardened SSH configuration for SENTINEL Contabo VPS
# FSR Domain: 4.7 - Logical Access Control
#
# IMPORTANT: Test before applying:
#   1. sshd -t -f /etc/ssh/sshd_config   (validate syntax)
#   2. Keep a backup SSH session open before restarting
#   3. systemctl restart sshd
#
# Prerequisites:
#   - SSH key authentication configured for all users
#   - 2FA already enabled (Google Authenticator / libpam-google-authenticator)
#   - sentinel-admin and sentinel-operator groups created
#
# Last updated: 2026-02-04
# Review cadence: Monthly

# =============================================================================
# Authentication
# =============================================================================

# Disable root login entirely
PermitRootLogin no

# Key-only authentication (no passwords over SSH)
PasswordAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey,keyboard-interactive

# Disable challenge-response (except for 2FA which uses keyboard-interactive)
ChallengeResponseAuthentication yes
KbdInteractiveAuthentication yes

# Limit authentication attempts
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 3:50:10

# =============================================================================
# Access Control
# =============================================================================

# Only allow members of SENTINEL groups
AllowGroups sentinel-admin sentinel-operator sentinel-developer

# Deny direct root access even if someone adds it to a group
DenyUsers root

# =============================================================================
# Session Management
# =============================================================================

# Client keepalive (detect dead connections)
ClientAliveInterval 300
ClientAliveCountMax 2

# Maximum concurrent sessions per user
MaxSessions 3

# =============================================================================
# Security Hardening
# =============================================================================

# Disable X11 forwarding (not needed for BMS server)
X11Forwarding no

# Disable TCP forwarding (use Cloudflare Tunnel instead)
AllowTcpForwarding no
AllowStreamLocalForwarding no
GatewayPorts no

# Disable agent forwarding
AllowAgentForwarding no

# Use only secure protocol version
Protocol 2

# Restrict to strong ciphers and MACs
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512

# Host key algorithms
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256

# =============================================================================
# Logging & Audit
# =============================================================================

# Verbose logging for security audit
LogLevel VERBOSE
SyslogFacility AUTH

# =============================================================================
# Miscellaneous
# =============================================================================

# Display warning banner before authentication
Banner /etc/ssh/sentinel-banner

# Disable unused features
PermitEmptyPasswords no
PermitUserEnvironment no
PrintMotd no
UseDNS no
Compression no

# Strict mode for file permissions
StrictModes yes

# =============================================================================
# 2FA Configuration Notes
# =============================================================================
#
# 2FA is already configured on this system via:
#   - libpam-google-authenticator (PAM module)
#   - /etc/pam.d/sshd includes pam_google_authenticator.so
#   - Each user has ~/.google_authenticator configured
#
# The AuthenticationMethods line above requires:
#   1. Valid SSH key (publickey)
#   2. TOTP code (keyboard-interactive via PAM)
#
# This provides true multi-factor authentication:
#   - Factor 1: Something you have (SSH private key)
#   - Factor 2: Something you know (TOTP from authenticator app)
#
# To add 2FA for a new user:
#   1. su - <username>
#   2. google-authenticator -t -d -f -r 3 -R 30 -w 3
#   3. Scan QR code with authenticator app
#   4. Save backup codes securely
