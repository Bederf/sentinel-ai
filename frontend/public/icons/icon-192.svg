<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" fill="#0a0a0f" rx="28"/>

  <!-- Shield shape -->
  <path
    d="M96 18
       L148 40
       L148 95
       Q148 140 96 170
       Q44 140 44 95
       L44 40
