<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL — Issue Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #070b0f;
    --surface: #0d1117;
    --surface2: #111827;
    --border: #1e2d3d;
    --text: #c9d1d9;
    --text-muted: #6e7b8a;
    --cluster: #4a9eff;
    --email: #4a9eff;
    --space: #f4900c;
    --occupancy: #2ecc71;
    --hvac: #e74c3c;
    --maintenance: #f1c40f;
    --security: #1abc9c;
    --energy: #9b59b6;
    --entity-person: #8b7fd4;
    --entity-room: #2980b9;
    --escalation: #e74c3c;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }

  .header-left { display: flex; align-items: center; gap: 14px; }

  .sentinel-mark {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--cluster);
    text-transform: uppercase;
  }

  .header-divider {
    width: 1px; height: 20px;
    background: var(--border);
  }

  .cluster-title {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .cluster-state {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 3px;
    background: rgba(231, 76, 60, 0.15);
    border: 1px solid rgba(231, 76, 60, 0.4);
    color: #e74c3c;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .header-stats {
    display: flex;
    gap: 20px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .stat-value {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--text);
    line-height: 1;
  }

  .stat-label {
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Graph area */
  #cy {
    flex: 1;
    background: radial-gradient(ellipse at 50% 40%, #0d1520 0%, #070b0f 65%, #030507 100%);
    position: relative;
  }

  /* Legend */
  .legend {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: rgba(13, 17, 23, 0.92);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    z-index: 5;
    backdrop-filter: blur(8px);
  }

  .legend-title {
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .legend-items {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 9px;
    color: var(--text-muted);
  }

  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Controls */
  .controls {
    position: absolute;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
  }

  .ctrl-btn {
    width: 32px; height: 32px;
    background: rgba(13, 17, 23, 0.92);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
    backdrop-filter: blur(8px);
  }

  .ctrl-btn:hover {
    border-color: var(--cluster);
    color: var(--cluster);
  }

  /* Detail panel */
  .detail-panel {
    width: 300px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
    transform: translateX(100%);
    transition: transform 0.2s ease;
  }

  .detail-panel.open {
    transform: translateX(0);
  }

  .panel-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .panel-type-badge {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 2px;
    margin-bottom: 6px;
    display: inline-block;
  }

  .panel-title {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    line-height: 1.3;
  }

  .panel-close {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px;
    flex-shrink: 0;
  }

  .panel-close:hover { color: var(--text); }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
  }

  .panel-body::-webkit-scrollbar { width: 4px; }
  .panel-body::-webkit-scrollbar-track { background: transparent; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .panel-section {
    margin-bottom: 16px;
  }

  .panel-section-title {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .metric-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid rgba(30, 45, 61, 0.5);
    font-size: 10px;
  }

  .metric-row:last-child { border-bottom: none; }

  .metric-key { color: var(--text-muted); }
  .metric-val { color: var(--text); }

  .confidence-bar-wrap {
    margin-top: 4px;
  }

  .confidence-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }

  .confidence-fill {
    height: 100%;
    background: var(--cluster);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .classification-item {
    margin-bottom: 8px;
  }

  .classification-row {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    margin-bottom: 3px;
  }

  .classification-domain { color: var(--text); }
  .classification-score { color: var(--text-muted); }

  .evidence-item {
    font-size: 9px;
    padding: 4px 8px;
    background: var(--surface2);
    border-radius: 3px;
    color: var(--text-muted);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .evidence-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--cluster);
    flex-shrink: 0;
  }

  .action-list { list-style: none; }
  .action-list li {
    font-size: 9px;
    color: var(--text-muted);
    padding: 5px 0;
    border-bottom: 1px solid rgba(30, 45, 61, 0.4);
    padding-left: 12px;
    position: relative;
  }
  .action-list li::before {
    content: '\2192';
    position: absolute;
    left: 0;
    color: var(--cluster);
  }

  .advisory-note {
    font-size: 8px;
    color: var(--text-muted);
    background: rgba(74, 158, 255, 0.05);
    border: 1px solid rgba(74, 158, 255, 0.15);
    border-radius: 3px;
    padding: 6px 8px;
    margin-top: 12px;
    line-height: 1.5;
  }

  /* Hint bar */
  .hint-bar {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    pointer-events: none;
    opacity: 0.7;
  }
</style>
</head>

// Pin cluster at centre after layout (pinned, not locked - user can drag)
cy.ready(function() {
  setTimeout(function() {
    var clusterNode = cy.$('#cluster\\:001');
    clusterNode.lock();
  }, 1000);
});

// ---- Hover interactions ----
cy.on('mouseover', 'node', function(evt) {
  var node = evt.target;
  var neighborhood = node.closedNeighborhood();
  cy.elements().not(neighborhood).addClass('dimmed');
  neighborhood.removeClass('dimmed').addClass('highlighted');
  neighborhood.connectedEdges().addClass('highlighted').removeClass('dimmed');
});

cy.on('mouseout', 'node', function() {
  cy.elements().removeClass('dimmed highlighted');
});

// ---- Click -> detail panel ----
cy.on('tap', 'node', function(evt) {
  var node = evt.target;
  var data = node.data();
  openPanel(data);
});

cy.on('tap', function(evt) {
  if (evt.target === cy) closePanel();
});

// ---- Detail panel ----
var panel      = document.getElementById('detail-panel');
var panelTitle = document.getElementById('panel-title');
var panelBadge = document.getElementById('panel-type-badge');
var panelBody  = document.getElementById('panel-body');

document.getElementById('panel-close').addEventListener('click', closePanel);

var DOMAIN_LABELS = {
  cluster: 'Issue Cluster',
  email:   'Email Signal',
  space_optimisation: 'Space Signal',
  occupancy: 'Occupancy Signal',
  hvac: 'HVAC Signal',
  maintenance: 'Maintenance Signal',
  entity: 'Entity',
};

var DOMAIN_HEX = {
  cluster: '#4a9eff',
  email:   '#4a9eff',
  space_optimisation: '#f4900c',
  occupancy: '#2ecc71',
  hvac: '#e74c3c',
  maintenance: '#f1c40f',
  entity: '#8b7fd4',
};

function openPanel(data) {
  var color = DOMAIN_HEX[data.domain] || '#4a9eff';
  var typeLabel = DOMAIN_LABELS[data.domain] || data.domain;

  panelBadge.textContent = typeLabel.toUpperCase();
  panelBadge.style.background = color + '18';
  panelBadge.style.border = '1px solid ' + color + '44';
  panelBadge.style.color = color;

  panelTitle.textContent = data.label;

  if (data.node_type === 'cluster') {
    panelBody.innerHTML = renderClusterPanel(data.metadata, data);
  } else if (data.node_type === 'signal') {
    panelBody.innerHTML = renderSignalPanel(data);
  } else if (data.node_type === 'entity') {
    panelBody.innerHTML = renderEntityPanel(data);
  }

  panel.classList.add('open');
}

function closePanel() {
  panel.classList.remove('open');
}

function renderClusterPanel(m, data) {
  var classItems = (m.classifications || []).map(function(c) {
    return '<div class="classification-item">' +
      '<div class="classification-row">' +
        '<span class="classification-domain">' + c.domain.replace(/_/g, ' ') + '</span>' +
        '<span class="classification-score">' + (c.confidence * 100).toFixed(0) + '%</span>' +
      '</div>' +
      '<div class="confidence-bar">' +
        '<div class="confidence-fill" style="width:' + (c.confidence*100) + '%; background:' + (DOMAIN_HEX[c.domain] || '#4a9eff') + '"></div>' +
      '</div>' +
    '</div>';
  }).join('');

  var actions = (m.recommended_actions || []).map(function(a) { return '<li>' + a + '</li>'; }).join('');

  return '<div class="panel-section">' +
    '<div class="panel-section-title">Status</div>' +
    '<div class="metric-row"><span class="metric-key">State</span><span class="metric-val" style="color:#e74c3c">' + m.cluster_state + '</span></div>' +
    '<div class="metric-row"><span class="metric-key">Severity</span><span class="metric-val">' + (data.severity || 'unknown') + '</span></div>' +
    '<div class="metric-row"><span class="metric-key">Open for</span><span class="metric-val">' + m.duration_days + ' days</span></div>' +
    '<div class="metric-row"><span class="metric-key">Confidence</span><span class="metric-val">' + (data.confidence || 0) + '</span></div>' +
  '</div>' +
  '<div class="panel-section">' +
    '<div class="panel-section-title">Classifications</div>' +
    classItems +
  '</div>' +
  '<div class="panel-section">' +
    '<div class="panel-section-title">Likely Root Cause</div>' +
    '<div style="font-size:10px; color:#a0b0c0; line-height:1.5;">' + (m.likely_root_cause || '\u2014') + '</div>' +
  '</div>' +
  '<div class="panel-section">' +
    '<div class="panel-section-title">Recommended Actions</div>' +
    '<ul class="action-list">' + actions + '</ul>' +
    '<div class="advisory-note">These actions are advisory. Human decision required before acting on any booking or policy change.</div>' +
  '</div>';
}

function renderSignalPanel(data) {
  var m = data.metadata || {};
  var color = DOMAIN_HEX[data.domain] || '#4a9eff';
  var evidence = (m.evidence_basis || []).map(function(e) {
    return '<div class="evidence-item"><div class="evidence-dot" style="background:' + color + '"></div>' + e.replace(/_/g, ' ') + '</div>';
  }).join('');

  return '<div class="panel-section">' +
    '<div class="panel-section-title">Signal Details</div>' +
    (m.sender ? '<div class="metric-row"><span class="metric-key">Sender</span><span class="metric-val">' + m.sender + '</span></div>' : '') +
    (m.sent_at ? '<div class="metric-row"><span class="metric-key">Date</span><span class="metric-val">' + m.sent_at + '</span></div>' : '') +
    '<div class="metric-row"><span class="metric-key">Type</span><span class="metric-val">' + (data.signal_type || '').replace(/_/g, ' ') + '</span></div>' +
    (m.signal_subtype ? '<div class="metric-row"><span class="metric-key">Subtype</span><span class="metric-val">' + m.signal_subtype + '</span></div>' : '') +
    '<div class="metric-row"><span class="metric-key">Severity</span><span class="metric-val">' + (data.severity || '\u2014') + '</span></div>' +
    '<div class="metric-row"><span class="metric-key">Confidence</span><span class="metric-val">' + (data.confidence || '\u2014') + '</span></div>' +
    '<div class="confidence-bar-wrap">' +
      '<div class="confidence-bar">' +
        '<div class="confidence-fill" style="width:' + ((data.confidence||0)*100) + '%; background:' + color + '"></div>' +
      '</div>' +
    '</div>' +
  '</div>' +
  '<div class="panel-section">' +
    '<div class="panel-section-title">Summary</div>' +
    '<div style="font-size:10px; color:#a0b0c0; line-height:1.6;">' + (m.summary || '\u2014') + '</div>' +
  '</div>' +
  (evidence ? '<div class="panel-section">' +
    '<div class="panel-section-title">Evidence Basis</div>' +
    evidence +
  '</div>' : '');
}

function renderEntityPanel(data) {
  var m = data.metadata || {};

  return '<div class="panel-section">' +
    '<div class="panel-section-title">Entity</div>' +
    '<div class="metric-row"><span class="metric-key">Type</span><span class="metric-val">' + (data.entity_type || 'unknown') + '</span></div>' +
    (m.role ? '<div class="metric-row"><span class="metric-key">Role</span><span class="metric-val">' + m.role + '</span></div>' : '') +
    (m.department ? '<div class="metric-row"><span class="metric-key">Department</span><span class="metric-val">' + m.department + '</span></div>' : '') +
    (m.location_ref ? '<div class="metric-row"><span class="metric-key">Location</span><span class="metric-val">' + m.location_ref + '</span></div>' : '') +
  '</div>' +
  (m.note ? '<div class="advisory-note">' + m.note + '</div>' : '');
}

// ---- Controls ----
document.getElementById('btn-fit').addEventListener('click', function() {
  cy.fit(undefined, 40);
});
document.getElementById('btn-zoom-in').addEventListener('click', function() {
  cy.zoom({ level: cy.zoom() * 1.25, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
});
document.getElementById('btn-zoom-out').addEventListener('click', function() {
  cy.zoom({ level: cy.zoom() * 0.8, renderedPosition: { x: cy.width()/2, y: cy.height()/2 } });
});
</script>
