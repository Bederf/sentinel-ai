[pytest]
# Pytest configuration for BMS Intelligence backend

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    slow: Tests that take longer than 5 seconds
    performance: Performance benchmarks
    security: Security validation tests
    e2e: End-to-end tests
    readonly: Tests that only read data (no writes)
    writetest: Controlled write tests (needs AEGIS gate)
    failuretest: Deliberate failure and rollback tests

# Asyncio configuration
asyncio_mode = auto

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    --timeout=60

# Silence deprecations from third-party libraries.
filterwarnings =
    ignore:.*PyparsingDeprecationWarning.*:DeprecationWarning:pyiceberg.*
    ignore:.*PydanticDeprecatedSince212.*:DeprecationWarning:pyiceberg.*
    ignore:.*enablePackrat.*:Warning:pyparsing.*
    ignore:.*escChar.*:Warning:pyparsing.*
    ignore:.*unquoteResults.*:Warning:pyparsing.*
    ignore:/etc/timezone is deprecated.*:UserWarning:tzlocal.*
    ignore:.*joblib will operate in serial mode.*:UserWarning:joblib.*
    ignore:Please use `import python_multipart` instead\.:PendingDeprecationWarning:multipart.*
# Coverage configuration (when using pytest-cov)
# --cov=app
# --cov-report=html
# --cov-report=term-missing
# --cov-fail-under=80

# Minimum Python version
minversion = 7.0
