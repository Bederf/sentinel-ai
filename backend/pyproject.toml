[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bms-intelligence"
version = "1.0.0"
description = "SENTINEL BMS Intelligence Platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

[tool.ruff.lint]
# Enable comprehensive linting rules
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]

# Minimal ignore list - remove overly broad suppressions
ignore = [
    # Wide pre-existing violations — enable incrementally
    "E501",   # Line too long (formatter handles this)
    "ARG001", # Unused function arg (widespread in FastAPI handlers)
    "ARG002", # Unused method arg (often required by interfaces)
    "ARG005", # Unused lambda arg (widespread)
    "B008",   # Depends() call in FastAPI arg defaults (standard pattern)
    "B009",   # getattr with constant string (legacy, accepted)
    "B010",   # setattr with constant string (legacy, accepted)
    "B904",   # raise without from (too many to fix in one pass)
    "DTZ001", # datetime.utcnow() — phase 220 deferred
    "DTZ005", # datetime.utcnow() — phase 220 deferred
    "DTZ011", # datetime.utcfromtimestamp() — phase 220 deferred
    "PLR2004", # Magic value comparison (legacy code style)
    "RUF001", # Ambiguous string char (pre-existing)
    "RUF002", # Ambiguous docstring char (pre-existing)
    "RUF003", # Ambiguous -> in docstring (pre-existing)
    "RUF012", # Mutable class default (widespread)
    "SIM102", # Nested if can be combined (pre-existing)
    "SIM105", # Use contextlib.suppress (pre-existing)
    "SIM115", # Open file context manager (legacy in scripts)
    "SIM117", # Multiple with can be merged (pre-existing)
    # Remaining pre-existing violations — fix incrementally
    "ARG004", "B005", "B007", "B017", "B025", "B905",
    "C401", "C408", "C416",
    "E402",
    "F821", "F823",
    "I001",
    "RUF006", "RUF013", "RUF015", "RUF034", "RUF059", "RUF100",
    "SIM103", "SIM108",
    "UP017", "UP042", "UP045",
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to have unused variables and imports
"tests/*" = [
    "ARG001",  # Unused arguments in test fixtures
    "F841",    # Unused variables in test setup
]

# MCP server tools can have unused imports (dynamic registration)
"app/mcp/*" = [
    "F841",  # Unused variables in tool definitions
]

[tool.ruff.lint.isort]
# Enforce import grouping: stdlib, third-party, local
known-first-party = ["app"]

# ============================================================================
# Type Checking (mypy)
# ============================================================================

[tool.mypy]
# Baseline: 4461 errors in 785 files (triage: 497637bd correction)
# Gate: per-file regression only — see .pre-commit/mypy-regression.sh
# Do NOT use absolute count gates — baseline is too large to be meaningful
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true
# strict = true removed — codebase not written to strict mode
# Re-enable per-module via [[tool.mypy.overrides]] as modules are hardened

# Per-module type ignore rules (for legacy code being migrated)
[[tool.mypy.overrides]]
module = [
    "app.services.lifecycle_orchestrator",
    "app.services.backup_service",
    "app.services.optimization_tier_router",
    "app.api.chat",
    "app.api.lighting",
    "app.api.optimization",
    "app.config.settings",
]
ignore_errors = true  # Temporarily allow errors in high-complexity modules

# ============================================================================
# Complexity and Size Checks (God File Prevention)
# ============================================================================

[tool.pylint.basic]
# Maximum lines per module - flag god files
max-module-lines = 800  # Warn on modules > 800 lines

[tool.pylint.design]
# Max number of arguments per function
max-args = 8
# Max number of attributes per class
max-attributes = 10
# Max number of branches per function (cyclomatic complexity)
max-branches = 12
# Max number of locals per function
max-locals = 15
# Max number of public methods per class
max-public-methods = 25
