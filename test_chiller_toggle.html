<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Chiller Toggle</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .device { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .control { margin-top: 10px; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; }
        .on { background-color: #4CAF50; color: white; }
        .off { background-color: #f44336; color: white; }
        .status { font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Test Chiller Toggle Control</h1>

    <div class="device">
        <h3>Gateway Chiller (001-gwc-chiller-001)</h3>
        <div class="status" id="status-1">Current Status: Loading...</div>
        <div class="control">
            <button id="toggle-1" onclick="toggleChiller('001-gwc-chiller-001', 'chiller_status', 1)">
                Toggle Chiller
            </button>
        </div>
    </div>

    <div class="device">
        <h3>Matla Chiller (003-mmc-chiller-001)</h3>
        <div class="status" id="status-2">Current Status: Loading...</div>
        <div class="control">
            <button id="toggle-2" onclick="toggleChiller('003-mmc-chiller-001', 'chiller_status', 2)">
                Toggle Chiller
            </button>
        </div>
    </div>

    <script>
        // Load current status on page load
        window.onload = function() {
            loadChillerStatus('001-gwc-chiller-001', 'status-1');
            loadChillerStatus('003-mmc-chiller-001', 'status-2');
        };

        async function loadChillerStatus(deviceId, statusElementId) {
            try {
                const response = await fetch(`http://localhost:9095/api/devices/${deviceId}`);
                const data = await response.json();
                const status = data.points.chiller_status.current_value;
                const statusText = getStatusText(status);
                document.getElementById(statusElementId).innerHTML = `Current Status: ${statusText}`;
            } catch (error) {
                document.getElementById(statusElementId).innerHTML = 'Error loading status';
            }
        }

        function getStatusText(value) {
            switch(value) {
                case 0: return 'OFF';
                case 1: return 'RUNNING';
                case 2: return 'ALARM';
                case 3: return 'MAINTENANCE';
                default: return 'UNKNOWN';
            }
        }

        async function toggleChiller(deviceId, pointName, buttonId) {
            const button = document.getElementById(`toggle-${buttonId}`);
            button.disabled = true;
            button.textContent = 'Processing...';

            try {
                // First get current value
                const response = await fetch(`http://localhost:9095/api/devices/${deviceId}`);
                const data = await response.json();
                const currentValue = data.points.chiller_status.current_value;

                // Toggle between 0 (off) and 1 (running)
                const newValue = currentValue === 1 ? 0 : 1;

                // Send control command
                const controlResponse = await fetch(`http://localhost:9095/api/devices/${deviceId}/control`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        point: pointName,
                        value: newValue,
                        priority: 8
                    })
                });

                const result = await controlResponse.json();

                if (result.success) {
                    // Update status display
                    const statusText = getStatusText(newValue);
                    document.getElementById(`status-${buttonId}`).innerHTML = `Current Status: ${statusText}`;

                    // Update button style
                    button.className = newValue === 1 ? 'on' : 'off';
                } else {
                    alert(`Control failed: ${result.message}`);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                button.disabled = false;
                button.textContent = 'Toggle Chiller';
            }
        }
    </script>
</body>
</html>
