version: "3.8"

services:
  backend:
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
    ports:
      - "9095:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 9096"
    volumes:
      - ./frontend:/app
    ports:
      - "9096:9096"
    depends_on:
      backend:
        condition: service_started
