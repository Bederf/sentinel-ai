name: Test Suite

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint

      - name: Check for god files (TypeScript)
        run: |
          echo "Checking for TypeScript files > 500 lines..."
          find src -name "*.ts" -o -name "*.tsx" | xargs wc -l | awk '$1 > 500 {print $0; count++} END {if (count > 0) {print "::warning::Found " count " TypeScript files > 500 lines"}}'

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:run

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for circular imports
        run: pytest tests/test_import_cycles.py -v

      - name: Check for god files (Python)
        run: |
          echo "Checking for Python files > 500 lines..."
          find app -name "*.py" -exec wc -l {} + | awk '$1 > 500 {print $0; count++} END {if (count > 0) {print "::warning::Found " count " Python files > 500 lines"}}'

      - name: Run unit tests
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
        env:
          TESTING: "true"
          DEMO_MODE: "true"
          JWT_SECRET_KEY: "test-only-jwt-secret-for-ci-at-least-32-chars"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Install Playwright
        run: |
          cd e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Start backend server
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          uvicorn app.main:app --host 0.0.0.0 --port 9095 &
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run E2E tests
        run: |
          cd e2e
          npm run test
        env:
          E2E_BASE_URL: http://localhost:9096

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
