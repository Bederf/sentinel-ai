name: Test Suite

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linter
        run: npm run lint

      - name: Check for god files (TypeScript)
        run: |
          echo "Checking for TypeScript files > 500 lines..."
          find src -name "*.ts" -o -name "*.tsx" | xargs wc -l | awk '$1 > 500 {print $0; count++} END {if (count > 0) {print "::warning::Found " count " TypeScript files > 500 lines"}}'

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:run

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      # Settings() validates these at import time — every test step needs them,
      # not just tests that exercise site/DB logic directly.
      POPIA_MODE: "development"
      CONSENT_HASH_SALT: "test-consent-salt-for-ci-at-least-32-chars-long"
      SITE_ID: "test-site"
      PLANT_SITE_ID: "test-site"
      BUILDING_NAME: "Test Building"
      SUPABASE_URL: "http://127.0.0.1:55321"
      SUPABASE_SERVICE_ROLE_KEY: "test-key-not-real"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:55322/postgres"
      TESTING: "true"
      JWT_SECRET_KEY: "test-only-jwt-secret-for-ci-at-least-32-chars"
      MODBUS_BESS_IP: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev

      - name: Install dependencies
        # uv avoids pip 24+'s resolution-too-deep guard on this dependency graph
        # (see git history: 88f1efdc7 — this was already solved once and lost in
        # a later workflow rewrite; do not go back to --no-build-isolation + a
        # silent fallback, it masks real resolution failures as build errors).
        run: |
          pip install uv
          pip install pytest pytest-asyncio pytest-cov pytest-mock pytest-timeout
          uv pip install --system --index-strategy unsafe-best-match -r requirements.txt

      - name: Check for circular imports
        run: |
          python -m pytest tests/test_import_cycles.py -v

      - name: Run unit tests
        # Excludes: integration (needs live Supabase), performance/slow (resource-heavy)
        # These are run separately in the nightly integration pipeline.
        run: |
          python -m pytest tests/ \
            -m "not integration and not performance and not slow" \
            --ignore=tests/integration \
            --ignore=tests/load \
            -v --cov=app --cov-report=xml --cov-report=html \
            --timeout=30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    continue-on-error: true  # E2E tests reference outdated nav structure; don't block CI
    needs: [frontend-tests, backend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Install Playwright
        run: |
          cd e2e
          npm install
          npx playwright install --with-deps chromium

      - name: Start backend server
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt --no-build-isolation
          uvicorn app.main:app --host 0.0.0.0 --port 9095 &
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run E2E tests
        run: |
          cd e2e
          npm run test
        env:
          E2E_BASE_URL: http://localhost:9096

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
