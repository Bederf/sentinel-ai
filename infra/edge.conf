# /etc/sentinel/edge.conf
# SENTINEL Edge Configuration — deployed to Jetson Orin
# Source of truth for all edge runtime configuration.
# Loaded by systemd units via EnvironmentFile=/etc/sentinel/edge.conf
#
# WARNING: Do not commit site-specific values to git.
# This file in git contains DEFAULTS only.
# Override on the device: sudo nano /etc/sentinel/edge.conf
#
# Deployed: 2026-03-22 | Phase 165 (The Discovery)
#
# Deployment:
#   sudo mkdir -p /etc/sentinel
#   sudo cp infra/edge.conf /etc/sentinel/edge.conf
#   sudo chmod 640 /etc/sentinel/edge.conf

# ─── Site Identity ────────────────────────────────────────────────────────────
# SITE_ID: stable building identifier (matches Supabase buildings.code).
# Used by Avahi mDNS: sentinel-{SITE_ID}.local
# Example: site-002 → sentinel-site-002.local
SITE_ID=site-002

# ─── Edge Runtime ─────────────────────────────────────────────────────────────
EDGE_MODE=true
DEMO_MODE=false

# ─── AI Model ─────────────────────────────────────────────────────────────────
# Local model via Ollama (no internet required in production)
OLLAMA_MODEL=deepseek-r1:14b
OLLAMA_BASE_URL=http://localhost:11434

# ─── Network ──────────────────────────────────────────────────────────────────
# Port SENTINEL backend listens on
SENTINEL_PORT=9095

# mDNS service name (auto-constructed from SITE_ID)
# sentinel-${SITE_ID}.local → this Jetson's LAN IP
MDNS_SERVICE_NAME=sentinel-${SITE_ID}

# ─── Security ─────────────────────────────────────────────────────────────────
# Set to the Supabase JWT secret for this deployment
# SUPABASE_JWT_SECRET=
# SUPABASE_URL=
# SUPABASE_KEY=
