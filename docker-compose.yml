# BMS Intelligence Docker Compose
# Development and demo configuration
# Includes: Backend, Frontend, InfluxDB, Loki, Promtail, Wazuh (Phase 63 Security)

version: "3.8"

services:
  # Caddy Reverse Proxy - HTTPS termination and routing
  caddy:
    image: caddy:2-alpine
    container_name: bms-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - bms-network
    environment:
      - ACME_AGREE=true
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service"
    labels:
      - "service=sentinel-caddy"

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bms-backend
    ports:
      - "8082:8000"  # Also exposed for direct API access if needed
    expose:
      - "8000"  # Caddy proxy uses internal network
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/app:/app/app:ro
    networks:
      - bms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service"
    labels:
      - "service=sentinel-backend"

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bms-frontend
    expose:
      - "80"  # Caddy proxy uses internal network
    ports:
      - "3002:80"  # Also exposed for development if needed
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bms-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=sentinel-frontend"

  # InfluxDB Time-Series Database
  influxdb:
    image: influxdb:2.7-alpine
    container_name: bms-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-bms-admin-password}
      - DOCKER_INFLUXDB_INIT_ORG=bms-intelligence
      - DOCKER_INFLUXDB_INIT_BUCKET=sensor_data_raw
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-bms-dev-token-change-in-production}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
      - ./docker/influxdb/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./docker/influxdb/downsample_1h.flux:/docker-entrypoint-initdb.d/downsample_1h.flux:ro
      - ./docker/influxdb/downsample_1d.flux:/docker-entrypoint-initdb.d/downsample_1d.flux:ro
    networks:
      - bms-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=sentinel-influxdb"

  # ============================================================
  # Log Aggregation Stack (Phase 63 - FSR Security Compliance)
  # ============================================================

  # Grafana Loki - Centralised Log Storage
  # Retention: 90 days (FSR domain 4.13 compliance)
  loki:
    image: grafana/loki:2.9.3
    container_name: bms-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./infrastructure/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - bms-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Promtail - Log Collector (ships to Loki)
  # Collects: Docker container logs, system auth logs, syslog, SENTINEL audit logs
  promtail:
    image: grafana/promtail:2.9.3
    container_name: bms-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./infrastructure/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./backend/app/data:/opt/bms-intelligence/backend/app/data:ro
    depends_on:
      - loki
    networks:
      - bms-network

  # ============================================================
  # Host-Based Intrusion Detection (Phase 63-02 - FSR Domain 4.13)
  # ============================================================

  # Wazuh Agent - Host-Based IDS/IPS
  # File integrity monitoring, log analysis, rootkit detection, active response
  # Covers both SENTINEL and AimTheLaw on shared Contabo VPS
  wazuh-agent:
    image: wazuh/wazuh-agent:4.9.0
    container_name: bms-wazuh-agent
    restart: unless-stopped
    network_mode: host
    environment:
      - WAZUH_MANAGER=localhost
      - WAZUH_AGENT_NAME=contabo-sentinel
    volumes:
      # Wazuh configuration
      - ./infrastructure/wazuh/ossec.conf:/var/ossec/etc/ossec.conf:ro
      - ./infrastructure/wazuh/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      # Persistent data
      - wazuh-data:/var/ossec/data
      # System log monitoring (read-only)
      - /var/log:/var/log:ro
      # Docker socket for container monitoring (read-only)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Application directories for FIM (read-only)
      - /opt/bms-intelligence/backend/.env:/opt/bms-intelligence/backend/.env:ro
      - /opt/bms-intelligence/docker-compose.yml:/opt/bms-intelligence/docker-compose.yml:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/shadow:/host/etc/shadow:ro
      - /etc/ssh:/host/etc/ssh:ro
    cap_add:
      - SYS_PTRACE     # Required for rootkit detection
      - NET_ADMIN       # Required for active response (firewall-drop)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=sentinel-wazuh-agent"

  # Fail2Ban - Brute Force Protection
  # SSH protection, API rate limit enforcement, escalation rules
  # Ported from AimTheLaw, adapted for SENTINEL endpoints
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: bms-fail2ban
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN       # Required for iptables manipulation
      - NET_RAW         # Required for packet filtering
    volumes:
      - ./infrastructure/fail2ban/jail.local:/etc/fail2ban/jail.local:ro
      - fail2ban-data:/var/lib/fail2ban
      - /var/log:/var/log:ro
    environment:
      - TZ=Africa/Johannesburg
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service"
    labels:
      - "service=sentinel-fail2ban"

volumes:
  caddy-data:
  caddy-config:
  influxdb-data:
  influxdb-config:
  loki-data:
  wazuh-data:
  fail2ban-data:

networks:
  bms-network:
    driver: bridge
