# BMS Intelligence Docker Compose
# Development and demo configuration

version: "3.8"

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bms-backend
    ports:
      - "8082:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/app:/app/app:ro
    networks:
      - bms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8082
    container_name: bms-frontend
    ports:
      - "3002:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bms-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # InfluxDB Time-Series Database
  influxdb:
    image: influxdb:2.7-alpine
    container_name: bms-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-bms-admin-password}
      - DOCKER_INFLUXDB_INIT_ORG=bms-intelligence
      - DOCKER_INFLUXDB_INIT_BUCKET=sensor_data_raw
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-bms-dev-token-change-in-production}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
      - ./docker/influxdb/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./docker/influxdb/downsample_1h.flux:/docker-entrypoint-initdb.d/downsample_1h.flux:ro
      - ./docker/influxdb/downsample_1d.flux:/docker-entrypoint-initdb.d/downsample_1d.flux:ro
    networks:
      - bms-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  influxdb-data:
  influxdb-config:

networks:
  bms-network:
    driver: bridge
