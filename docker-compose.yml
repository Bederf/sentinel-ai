# BMS Intelligence Docker Compose
# Development and demo configuration

version: "3.8"

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bms-backend
    ports:
      - "8082:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - bms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8082
    container_name: bms-frontend
    ports:
      - "3002:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bms-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  bms-network:
    driver: bridge
