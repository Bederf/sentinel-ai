<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL Module System Playground</title>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #161922;
    --bg3: #1c1f2e;
    --border: #2a2d3e;
    --text: #e2e4ea;
    --text2: #8b8fa3;
    --text3: #565a6e;
    --amber: #f59e0b;
    --amber-dim: rgba(245,158,11,0.15);
    --green: #22c55e;
    --green-dim: rgba(34,197,94,0.15);
    --red: #ef4444;
    --red-dim: rgba(239,68,68,0.15);
    --blue: #3b82f6;
    --blue-dim: rgba(59,130,246,0.15);
    --purple: #a855f7;
    --purple-dim: rgba(168,85,247,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
  }
  header {
    grid-column: 1 / -1;
    padding: 12px 20px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    color: var(--amber);
  }
  header .subtitle {
    font-size: 12px;
    color: var(--text2);
  }
  .presets {
    display: flex;
    gap: 6px;
  }
  .preset-btn {
    padding: 4px 10px;
    font-size: 11px;
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text2);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .preset-btn:hover {
    background: var(--amber-dim);
    color: var(--amber);
    border-color: var(--amber);
  }
  .controls {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px;
  }
  .control-section {
    margin-bottom: 16px;
  }
  .control-section h3 {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text2);
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .module-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 8px;
    border-radius: 4px;
    margin-bottom: 2px;
    transition: background 0.1s;
  }
  .module-row:hover {
    background: rgba(255,255,255,0.03);
  }
  .module-row .label {
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .module-row .label .emoji {
    font-size: 14px;
    width: 20px;
    text-align: center;
  }
  .module-row .badge {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: 600;
  }
  .badge-on {
    background: var(--green-dim);
    color: var(--green);
  }
  .badge-base {
    background: var(--blue-dim);
    color: var(--blue);
  }
  .badge-off {
    background: rgba(255,255,255,0.05);
    color: var(--text3);
  }
  .toggle {
    position: relative;
    width: 36px;
    height: 20px;
    cursor: pointer;
  }
  .toggle input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .toggle .slider {
    position: absolute;
    inset: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: all 0.2s;
  }
  .toggle .slider::before {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    left: 2px;
    top: 2px;
    background: var(--text3);
    border-radius: 50%;
    transition: all 0.2s;
  }
  .toggle input:checked + .slider {
    background: var(--amber);
    border-color: var(--amber);
  }
  .toggle input:checked + .slider::before {
    transform: translateX(16px);
    background: white;
  }
  .toggle input:disabled + .slider {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .preview-area {
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .preview-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .preview-panel h2 {
    font-size: 12px;
    font-weight: 600;
    color: var(--text2);
    padding: 8px 12px;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .preview-panel .content {
    padding: 10px;
  }
  /* Sidebar preview */
  .sidebar-preview {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12px;
    transition: all 0.2s;
  }
  .sidebar-item.visible {
    background: rgba(255,255,255,0.03);
    color: var(--text);
  }
  .sidebar-item.hidden {
    background: var(--red-dim);
    color: var(--text3);
    text-decoration: line-through;
    opacity: 0.5;
  }
  .sidebar-item .icon {
    width: 18px;
    text-align: center;
    font-size: 13px;
  }
  .sidebar-item .tag {
    margin-left: auto;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.06);
    color: var(--text3);
  }
  .sidebar-sep {
    height: 1px;
    background: var(--border);
    margin: 4px 8px;
  }
  /* Tabs preview */
  .tabs-preview {
    display: flex;
    gap: 0;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
  }
  .tab-item {
    padding: 8px 12px;
    font-size: 11px;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .tab-item.visible {
    color: var(--text);
  }
  .tab-item.active {
    color: var(--amber);
    border-bottom-color: var(--amber);
    background: var(--amber-dim);
  }
  .tab-item.hidden {
    color: var(--text3);
    text-decoration: line-through;
    opacity: 0.4;
  }
  .tab-item .control-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .control-dot.on { background: var(--green); }
  .control-dot.off { background: var(--red); }
  .control-dot.none { background: var(--text3); opacity: 0.3; }
  .tab-detail {
    padding: 10px 12px;
    font-size: 11px;
    color: var(--text2);
    min-height: 50px;
  }
  .tab-detail .feature {
    display: inline-block;
    padding: 2px 8px;
    margin: 2px;
    border-radius: 3px;
    font-size: 10px;
  }
  .feature.unlocked {
    background: var(--green-dim);
    color: var(--green);
  }
  .feature.locked {
    background: var(--red-dim);
    color: var(--red);
    text-decoration: line-through;
  }
  .feature.readonly {
    background: var(--blue-dim);
    color: var(--blue);
  }
  /* Settings preview */
  .settings-section {
    margin-bottom: 8px;
  }
  .settings-section h4 {
    font-size: 10px;
    font-weight: 600;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .settings-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .settings-card {
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 10px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .settings-card.base {
    background: var(--blue-dim);
    border-color: rgba(59,130,246,0.3);
    color: var(--blue);
  }
  .settings-card.on {
    background: var(--green-dim);
    border-color: rgba(34,197,94,0.3);
    color: var(--green);
  }
  .settings-card.off {
    background: rgba(255,255,255,0.02);
    color: var(--text3);
  }
  /* Counts bar */
  .counts-bar {
    display: flex;
    gap: 12px;
    padding: 8px 12px;
    font-size: 11px;
    color: var(--text2);
    flex-wrap: wrap;
  }
  .counts-bar .count {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .counts-bar .num {
    font-weight: 700;
    font-size: 14px;
    color: var(--amber);
  }
  /* Prompt area */
  .prompt-area {
    grid-column: 1 / -1;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .prompt-text {
    flex: 1;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 11px;
    line-height: 1.5;
    color: var(--text2);
    white-space: pre-wrap;
    max-height: 100px;
    overflow-y: auto;
  }
  .copy-btn {
    padding: 6px 14px;
    background: var(--amber);
    color: #000;
    border: none;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .copy-btn:hover { filter: brightness(1.1); }
  .copy-btn.copied {
    background: var(--green);
  }
</style>
</head>
<body>
<div class="layout">
  <header>
    <div>
      <h1>SENTINEL Module System Playground</h1>
      <span class="subtitle">27 module types &middot; 4 categories &middot; interactive explorer</span>
    </div>
    <div class="presets">
      <button class="preset-btn" onclick="applyPreset('full')">Full Package</button>
      <button class="preset-btn" onclick="applyPreset('basic')">Basic BMS</button>
      <button class="preset-btn" onclick="applyPreset('office')">Office Building</button>
      <button class="preset-btn" onclick="applyPreset('solar')">Solar Site</button>
      <button class="preset-btn" onclick="applyPreset('minimal')">Monitoring Only</button>
    </div>
  </header>

  <div class="controls">
    <div class="control-section">
      <h3>Base Platform (7) &mdash; Always On</h3>
      <div id="base-platform"></div>
    </div>
    <div class="control-section">
      <h3>Base Building Systems (8) &mdash; Always On</h3>
      <div id="base-building"></div>
    </div>
    <div class="control-section">
      <h3>Control Add-ons (7) &mdash; Toggleable</h3>
      <div id="control-addons"></div>
    </div>
    <div class="control-section">
      <h3>Standalone Add-ons (5) &mdash; Toggleable</h3>
      <div id="standalone-addons"></div>
    </div>
  </div>

  <div class="preview-area">
    <div class="counts-bar" id="counts-bar"></div>

    <div class="preview-panel">
      <h2>Sidebar Navigation</h2>
      <div class="content sidebar-preview" id="sidebar-preview"></div>
    </div>

    <div class="preview-panel">
      <h2>Building Detail Tabs</h2>
      <div class="tabs-preview" id="tabs-preview"></div>
      <div class="tab-detail" id="tab-detail"></div>
    </div>

    <div class="preview-panel">
      <h2>Settings Page</h2>
      <div class="content" id="settings-preview"></div>
    </div>
  </div>

  <div class="prompt-area">
    <div class="prompt-text" id="prompt-output"></div>
    <button class="copy-btn" id="copy-btn" onclick="copyPrompt()">Copy Prompt</button>
  </div>
</div>

<script>
const BASE_PLATFORM = [
  { id: 'kpi', name: 'KPI', emoji: '📊' },
  { id: 'ml', name: 'ML Intelligence', emoji: '🧠' },
  { id: 'notifications', name: 'Notifications', emoji: '🔔' },
  { id: 'integrations', name: 'Integrations', emoji: '🔗' },
  { id: 'simbiot', name: 'SIMBIOT', emoji: '🔌' },
  { id: 'logging', name: 'Logging', emoji: '📝' },
  { id: 'assets', name: 'Assets', emoji: '🏗️' },
];

const BASE_BUILDING = [
  { id: 'hvac', name: 'HVAC', emoji: '❄️' },
  { id: 'energy', name: 'Energy', emoji: '⚡' },
  { id: 'lighting', name: 'Lighting', emoji: '💡' },
  { id: 'solar', name: 'Solar', emoji: '☀️' },
  { id: 'water', name: 'Water', emoji: '💧' },
  { id: 'fire', name: 'Fire', emoji: '🔥' },
  { id: 'security', name: 'Security', emoji: '🔒' },
  { id: 'digital_twin', name: 'Digital Twin', emoji: '🏢' },
];

const CONTROL_ADDONS = [
  { id: 'hvac_control', name: 'HVAC Control', emoji: '🎛️', gates: 'HVAC tab write features', features: ['Setpoints', 'Scheduling', 'Automation Rules'] },
  { id: 'energy_control', name: 'Energy Control', emoji: '🎛️', gates: 'Energy tab write features', features: ['Peak Shaving', 'Load Shedding', 'Generator Mgmt'] },
  { id: 'lighting_control', name: 'Lighting Control', emoji: '🎛️', gates: 'Lighting tab write features', features: ['DALI Scenes', 'Daylight Harvesting', 'Occupancy Automation'] },
  { id: 'solar_control', name: 'Solar Control', emoji: '🎛️', gates: 'Solar tab + AEGIS', features: ['AEGIS Dispatch', 'BESS Arbitrage', 'Load Shifting'] },
  { id: 'water_control', name: 'Water Control', emoji: '🎛️', gates: 'Water tab write features', features: ['Valve Automation', 'Leak Response'] },
  { id: 'security_control', name: 'Security Control', emoji: '🎛️', gates: 'Security tab write features', features: ['Door Commands', 'Access Schedules'] },
  { id: 'digital_twin_control', name: 'Twin Control', emoji: '🎛️', gates: 'Digital Twin write actions', features: ['Write from Twin', 'Scene Control'] },
];

const STANDALONE_ADDONS = [
  { id: 'maintenance', name: 'Maintenance', emoji: '🔧', sidebar: true, view: 'maintenance' },
  { id: 'financial', name: 'Financial', emoji: '💰', sidebar: true, view: 'financial' },
  { id: 'compliance', name: 'Compliance', emoji: '🛡️', sidebar: true, view: 'compliance' },
  { id: 'simulation', name: 'Simulation', emoji: '🔬', sidebar: false, buildingTab: true },
  { id: 'fleet_ml', name: 'Fleet ML', emoji: '📈', sidebar: true, view: 'fleet-ml' },
];

const SIDEBAR_ITEMS = [
  { label: 'Dashboard', icon: '📋', group: 'base', always: true },
  { label: 'AI Chat', icon: '💬', group: 'base', always: true },
  { label: 'System Health', icon: '❤️', group: 'base', always: true },
  { label: 'Logs', icon: '📄', group: 'base', always: true },
  { label: 'SIMBIOT', icon: '🔌', group: 'admin', always: true },
  { label: 'Settings', icon: '⚙️', group: 'admin', always: true },
  { label: 'Maintenance', icon: '🔧', group: 'addon', module: 'maintenance' },
  { label: 'Financial', icon: '💰', group: 'addon', module: 'financial' },
  { label: 'Compliance', icon: '🛡️', group: 'addon', module: 'compliance' },
  { label: 'Fleet ML', icon: '📈', group: 'addon', module: 'fleet_ml' },
];

const BUILDING_TABS = [
  { id: 'overview', label: 'Overview', icon: '📋', always: true },
  { id: 'hvac', label: 'HVAC', icon: '❄️', control: 'hvac_control', features: ['Setpoints', 'Scheduling', 'Automation Rules'] },
  { id: 'energy', label: 'Energy', icon: '⚡', control: 'energy_control', features: ['Peak Shaving', 'Load Shedding', 'Generator Mgmt'] },
  { id: 'lighting', label: 'Lighting', icon: '💡', control: 'lighting_control', features: ['DALI Scenes', 'Daylight Harvesting', 'Occupancy Auto'], subs: ['Lighting', 'Occupancy', 'Analytics', 'Correlation'] },
  { id: 'solar-bess', label: 'Solar & BESS', icon: '☀️', control: 'solar_control', features: ['AEGIS Dispatch', 'BESS Arbitrage', 'Load Shifting'], subs: ['Dashboard', 'AEGIS'] },
  { id: 'water', label: 'Water', icon: '💧', control: 'water_control', features: ['Valve Automation', 'Leak Response'] },
  { id: 'fire', label: 'Fire', icon: '🔥', readonly: true },
  { id: 'security', label: 'Security', icon: '🔒', control: 'security_control', features: ['Door Commands', 'Access Schedules'] },
  { id: 'digital-twin', label: 'Digital Twin', icon: '🏢', control: 'digital_twin_control', features: ['Write from Twin', 'Scene Control'] },
  { id: 'simulation', label: 'Simulation', icon: '🔬', requiredModule: 'simulation' },
];

// State
const state = {};
[...CONTROL_ADDONS, ...STANDALONE_ADDONS].forEach(m => { state[m.id] = true; });
let activeTab = 'overview';

// Initialize controls
function init() {
  renderBaseModules('base-platform', BASE_PLATFORM);
  renderBaseModules('base-building', BASE_BUILDING);
  renderToggleModules('control-addons', CONTROL_ADDONS);
  renderToggleModules('standalone-addons', STANDALONE_ADDONS);
  updateAll();
}

function renderBaseModules(containerId, modules) {
  const container = document.getElementById(containerId);
  container.innerHTML = modules.map(m => `
    <div class="module-row">
      <span class="label"><span class="emoji">${m.emoji}</span>${m.name}</span>
      <span class="badge badge-base">BASE</span>
    </div>
  `).join('');
}

function renderToggleModules(containerId, modules) {
  const container = document.getElementById(containerId);
  container.innerHTML = modules.map(m => `
    <div class="module-row">
      <span class="label"><span class="emoji">${m.emoji}</span>${m.name}</span>
      <label class="toggle">
        <input type="checkbox" ${state[m.id] ? 'checked' : ''} onchange="state['${m.id}']=this.checked;updateAll()">
        <span class="slider"></span>
      </label>
    </div>
  `).join('');
}

function updateAll() {
  renderSidebar();
  renderTabs();
  renderSettings();
  renderCounts();
  updatePrompt();
}

function renderSidebar() {
  const el = document.getElementById('sidebar-preview');
  let html = '';
  let lastGroup = '';
  SIDEBAR_ITEMS.forEach(item => {
    if (lastGroup && item.group !== lastGroup) html += '<div class="sidebar-sep"></div>';
    lastGroup = item.group;
    const visible = item.always || (item.module && state[item.module]);
    html += `<div class="sidebar-item ${visible ? 'visible' : 'hidden'}">
      <span class="icon">${item.icon}</span>
      <span>${item.label}</span>
      <span class="tag">${item.group}</span>
    </div>`;
  });
  el.innerHTML = html;
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs-preview');
  let html = '';
  BUILDING_TABS.forEach(tab => {
    let visible = true;
    if (tab.requiredModule && !state[tab.requiredModule]) visible = false;

    let dotClass = 'none';
    if (tab.control) dotClass = state[tab.control] ? 'on' : 'off';
    if (tab.readonly) dotClass = 'none';

    const isActive = activeTab === tab.id;
    const cls = !visible ? 'hidden' : isActive ? 'active' : 'visible';

    html += `<div class="tab-item ${cls}" onclick="activeTab='${tab.id}';updateAll()" style="cursor:pointer">
      <span>${tab.icon}</span>
      <span>${tab.label}</span>
      ${tab.control || tab.readonly ? `<span class="control-dot ${dotClass}"></span>` : ''}
    </div>`;
  });
  tabsEl.innerHTML = html;

  // Tab detail
  const detailEl = document.getElementById('tab-detail');
  const tab = BUILDING_TABS.find(t => t.id === activeTab);
  if (!tab) { detailEl.innerHTML = ''; return; }

  let detail = '';
  if (tab.always) {
    detail = '<span style="color:var(--text2)">Overview tab — always visible. Shows KPIs, equipment list, alerts, energy charts, predictions.</span>';
  } else if (tab.readonly) {
    detail = '<span style="color:var(--blue)">Read-only tab — no control toggle. Fire safety is always monitoring-only.</span>';
  } else if (tab.requiredModule) {
    if (!state[tab.requiredModule]) {
      detail = `<span style="color:var(--red)">Hidden — requires <b>${tab.requiredModule}</b> add-on to be active.</span>`;
    } else {
      detail = `<span style="color:var(--green)">Visible — <b>${tab.requiredModule}</b> add-on is active.</span>`;
    }
  } else if (tab.control) {
    const controlOn = state[tab.control];
    detail = `<div style="margin-bottom:6px;color:var(--text2)">Monitoring: <b style="color:var(--green)">always on</b> &nbsp;|&nbsp; Control: <b style="color:${controlOn?'var(--green)':'var(--red)'}">${controlOn?'enabled':'disabled'}</b> (${tab.control})</div>`;
    if (tab.features) {
      detail += '<div>' + tab.features.map(f =>
        `<span class="feature ${controlOn ? 'unlocked' : 'locked'}">${f}</span>`
      ).join('') + '</div>';
    }
    if (tab.subs) {
      detail += '<div style="margin-top:6px;font-size:10px;color:var(--text3)">Sub-tabs: ' + tab.subs.map(s => {
        if (s === 'AEGIS' && !controlOn) return `<s>${s}</s>`;
        return s;
      }).join(' · ') + '</div>';
    }
  }
  detailEl.innerHTML = detail;
}

function renderSettings() {
  const el = document.getElementById('settings-preview');
  let html = '';

  // Platform
  html += '<div class="settings-section"><h4>Platform (status only)</h4><div class="settings-grid">';
  BASE_PLATFORM.forEach(m => {
    html += `<div class="settings-card base">${m.emoji} ${m.name}</div>`;
  });
  html += '</div></div>';

  // Building Systems
  html += '<div class="settings-section"><h4>Building Systems (monitoring + control toggle)</h4><div class="settings-grid">';
  BASE_BUILDING.forEach(m => {
    const controlId = m.id + '_control';
    const hasControl = CONTROL_ADDONS.some(c => c.id === controlId);
    const controlOn = hasControl ? state[controlId] : null;
    let cls = 'base';
    let extra = '';
    if (hasControl) {
      extra = controlOn ? ' +ctrl' : '';
      cls = controlOn ? 'on' : 'base';
    }
    if (m.id === 'fire') extra = ' (read-only)';
    html += `<div class="settings-card ${cls}">${m.emoji} ${m.name}${extra}</div>`;
  });
  html += '</div></div>';

  // Add-ons
  html += '<div class="settings-section"><h4>Add-ons (on/off toggles)</h4><div class="settings-grid">';
  STANDALONE_ADDONS.forEach(m => {
    const on = state[m.id];
    html += `<div class="settings-card ${on ? 'on' : 'off'}">${m.emoji} ${m.name}</div>`;
  });
  html += '</div></div>';

  el.innerHTML = html;
}

function renderCounts() {
  const totalActive = 15 + Object.values(state).filter(Boolean).length;
  const controlOn = CONTROL_ADDONS.filter(c => state[c.id]).length;
  const standaloneOn = STANDALONE_ADDONS.filter(s => state[s.id]).length;
  const sidebarCount = 6 + STANDALONE_ADDONS.filter(s => s.sidebar && state[s.id]).length;
  const tabCount = BUILDING_TABS.filter(t => !t.requiredModule || state[t.requiredModule]).length;

  document.getElementById('counts-bar').innerHTML = `
    <div class="count"><span class="num">${totalActive}</span>/27 modules active</div>
    <div class="count"><span class="num">15</span> base (always on)</div>
    <div class="count"><span class="num">${controlOn}</span>/7 controls</div>
    <div class="count"><span class="num">${standaloneOn}</span>/5 add-ons</div>
    <div class="count"><span class="num">${sidebarCount}</span> sidebar items</div>
    <div class="count"><span class="num">${tabCount}</span> building tabs</div>
  `;
}

function updatePrompt() {
  const parts = [];
  const activeControls = CONTROL_ADDONS.filter(c => state[c.id]).map(c => c.name);
  const inactiveControls = CONTROL_ADDONS.filter(c => !state[c.id]).map(c => c.name);
  const activeAddons = STANDALONE_ADDONS.filter(s => state[s.id]).map(s => s.name);
  const inactiveAddons = STANDALONE_ADDONS.filter(s => !state[s.id]).map(s => s.name);

  if (inactiveControls.length === 0 && inactiveAddons.length === 0) {
    parts.push('All 12 add-on modules are active (full package).');
  } else {
    if (activeControls.length > 0) parts.push(`Control add-ons enabled: ${activeControls.join(', ')}.`);
    if (inactiveControls.length > 0) parts.push(`Control add-ons disabled: ${inactiveControls.join(', ')} — monitoring still visible but write features hidden.`);
    if (activeAddons.length > 0) parts.push(`Standalone add-ons enabled: ${activeAddons.join(', ')}.`);
    if (inactiveAddons.length > 0) parts.push(`Standalone add-ons disabled: ${inactiveAddons.join(', ')}.`);
  }

  // AEGIS note
  if (!state.solar_control) parts.push('AEGIS console is hidden (requires solar_control).');
  // Simulation note
  if (!state.simulation) parts.push('Simulation tab is hidden from building detail.');

  const totalActive = 15 + Object.values(state).filter(Boolean).length;
  document.getElementById('prompt-output').textContent =
    `Configure SENTINEL site with ${totalActive}/27 modules active. 15 base modules always on.\n${parts.join('\n')}`;
}

function copyPrompt() {
  const text = document.getElementById('prompt-output').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy Prompt'; btn.classList.remove('copied'); }, 1500);
  });
}

// Presets
function applyPreset(name) {
  const allOff = () => { Object.keys(state).forEach(k => state[k] = false); };
  const allOn = () => { Object.keys(state).forEach(k => state[k] = true); };

  switch(name) {
    case 'full':
      allOn();
      break;
    case 'basic':
      allOff();
      state.hvac_control = true;
      state.energy_control = true;
      break;
    case 'office':
      allOff();
      state.hvac_control = true;
      state.lighting_control = true;
      state.security_control = true;
      state.maintenance = true;
      break;
    case 'solar':
      allOff();
      state.hvac_control = true;
      state.energy_control = true;
      state.solar_control = true;
      state.simulation = true;
      break;
    case 'minimal':
      allOff();
      break;
  }
  // Re-render toggle checkboxes
  renderToggleModules('control-addons', CONTROL_ADDONS);
  renderToggleModules('standalone-addons', STANDALONE_ADDONS);
  updateAll();
}

init();
</script>
</body>
</html>
